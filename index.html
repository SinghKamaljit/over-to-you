<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Over To You</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#090e1a;
  --surface:#111827;
  --card:#1a2436;
  --border:#243044;
  --accent:#00d4ff;
  --accent2:#ff6b35;
  --text:#e8f0fe;
  --muted:#6b7ea0;
  --recording:#ef4444;
  --online:#22c55e;
  --sent:#f59e0b;
}

*{ box-sizing:border-box; margin:0; padding:0;
   -webkit-user-select:none; user-select:none;
   -webkit-tap-highlight-color:transparent; }

body{
  background:var(--bg); color:var(--text);
  font-family:'Nunito',sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
}

body::before{
  content:''; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,212,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,212,255,0.03) 1px,transparent 1px);
  background-size:40px 40px; pointer-events:none;
}

/* ── LOGIN ── */
#loginScreen{
  position:fixed; inset:0; background:var(--bg);
  display:flex; flex-direction:column;
  justify-content:center; align-items:center;
  gap:14px; padding:30px; z-index:100; overflow-y:auto;
}

.login-logo{
  font-family:'Rajdhani',sans-serif; font-size:2.8rem;
  font-weight:700; color:var(--accent);
  text-shadow:0 0 30px rgba(0,212,255,0.5);
  text-align:center; line-height:1.1;
}
.login-logo span{ color:var(--accent2); }

.login-subtitle{ color:var(--muted); text-align:center; font-size:0.9rem; }

.tab-row{
  display:flex; gap:8px; width:100%; max-width:320px;
}
.tab-btn{
  flex:1; padding:10px; border-radius:10px;
  border:1.5px solid var(--border); background:transparent;
  color:var(--muted); font-family:'Rajdhani',sans-serif;
  font-size:0.85rem; font-weight:700; cursor:pointer; transition:all 0.2s;
}
.tab-btn.active{ background:var(--card); border-color:var(--accent); color:var(--accent); }

#signupFields, #signinFields{
  display:flex; flex-direction:column; gap:12px;
  width:100%; max-width:320px; align-items:center;
}

.login-input{
  width:100%; max-width:320px; background:var(--card);
  border:1.5px solid var(--border); border-radius:14px;
  padding:14px 18px; color:var(--text); font-size:1rem;
  outline:none; font-family:'Nunito',sans-serif;
  -webkit-user-select:text !important; user-select:text !important;
}
.login-input:focus{ border-color:var(--accent); }

.login-btn{
  width:100%; max-width:320px; padding:15px; border:none;
  border-radius:14px;
  background:linear-gradient(135deg,var(--accent),#0099bb);
  color:#000; font-family:'Rajdhani',sans-serif;
  font-size:1.2rem; font-weight:700; cursor:pointer; transition:opacity 0.2s;
}
.login-btn:active{ opacity:0.8; }

.forgot-btn{
  background:none; border:none; color:var(--muted);
  font-size:0.82rem; cursor:pointer; text-decoration:underline;
  font-family:'Nunito',sans-serif;
}

.login-error{ color:#ff6b6b; display:none; font-size:0.85rem; text-align:center; max-width:320px; }

/* Friend-code reveal box shown after signup */
#codeReveal{
  display:none; flex-direction:column; align-items:center;
  gap:12px; width:100%; max-width:320px; text-align:center;
}
.code-box{
  background:var(--card); border:2px solid var(--accent);
  border-radius:16px; padding:18px 24px;
  font-family:'Rajdhani',sans-serif; font-size:2rem;
  font-weight:700; color:var(--accent);
  letter-spacing:3px;
  text-shadow:0 0 20px rgba(0,212,255,0.4);
  width:100%;
}
.code-label{ color:var(--muted); font-size:0.82rem; }
.code-hint{
  color:var(--text); font-size:0.85rem; line-height:1.5;
  padding:0 8px;
}
.code-copy-btn{
  width:100%; padding:13px; border-radius:50px; border:1px solid var(--accent);
  background:transparent; color:var(--accent);
  font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:700;
  cursor:pointer;
}
.code-go-btn{
  width:100%; padding:13px; border-radius:50px; border:none;
  background:linear-gradient(135deg,var(--accent),#0099bb);
  color:#000; font-family:'Rajdhani',sans-serif;
  font-size:1.1rem; font-weight:700; cursor:pointer;
}

/* ── APP ── */
#appScreen{ display:none; flex-direction:column; min-height:100vh; }

.app-header{
  position:sticky; top:0; z-index:10;
  background:rgba(9,14,26,0.95); backdrop-filter:blur(10px);
  padding:12px 16px; border-bottom:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:center;
}
.app-title{ font-family:'Rajdhani',sans-serif; font-size:1.5rem; font-weight:700; color:var(--accent); }

.user-badge{
  display:flex; align-items:center; gap:6px;
  background:var(--card); border:1px solid var(--border);
  border-radius:20px; padding:5px 12px;
  font-size:0.82rem; font-weight:700;
  font-family:'Rajdhani',sans-serif;
  color:var(--accent); cursor:pointer; letter-spacing:1px;
}
.user-dot{
  width:7px; height:7px; border-radius:50%;
  background:var(--online); box-shadow:0 0 6px var(--online);
}

.instructions{
  text-align:center; font-size:0.78rem; color:var(--muted);
  padding:8px 16px; background:rgba(0,212,255,0.04);
  border-bottom:1px solid var(--border);
}

/* ── GRID ── */
.grid-container{
  display:grid; grid-template-columns:repeat(2,1fr);
  gap:12px; padding:14px 12px 100px;
}

.friend-card{
  position:relative; background:var(--card);
  border:1.5px solid var(--border); border-radius:18px;
  padding:16px 10px 14px; display:flex; flex-direction:column;
  justify-content:center; align-items:center; text-align:center;
  aspect-ratio:1/1; cursor:pointer; overflow:hidden; transition:all 0.15s ease;
}
.friend-card.recording{ background:#1a0a0a; border-color:var(--recording); transform:scale(0.96); }
.friend-card.has-message{ border-color:var(--sent); animation:glowPulse 2s infinite; }

@keyframes glowPulse{
  0%,100%{ box-shadow:0 0 12px rgba(245,158,11,0.2); }
  50%{     box-shadow:0 0 20px rgba(245,158,11,0.5); }
}

.pulse-ring{
  display:none; position:absolute; inset:-4px; border-radius:20px;
  border:2px solid var(--recording); animation:pulseRing 1s infinite;
}
.friend-card.recording .pulse-ring{ display:block; }

@keyframes pulseRing{
  from{ opacity:1; transform:scale(1); }
  to{   opacity:0; transform:scale(1.05); }
}

.msg-indicator{
  position:absolute; top:7px; left:8px;
  width:10px; height:10px; border-radius:50%;
  background:var(--sent); display:none; box-shadow:0 0 6px var(--sent);
}
.friend-card.has-message .msg-indicator{ display:block; }

.edit-btn{
  position:absolute; top:7px; right:8px; font-size:0.7rem;
  color:var(--accent); font-family:'Rajdhani',sans-serif; font-weight:700;
  background:rgba(0,0,0,0.5); padding:2px 6px; border-radius:20px;
}

.card-avatar{ font-size:1.6rem; margin-bottom:6px; }
.card-name{
  font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:700;
  width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.card-status{
  font-size:0.72rem; color:var(--muted);
  width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* ── RECORDING TIMER ── */
.rec-timer{
  display:none; position:absolute; bottom:10px; left:50%;
  transform:translateX(-50%); font-family:'Rajdhani',sans-serif;
  font-size:0.85rem; font-weight:700; color:var(--recording); letter-spacing:1px;
}
.friend-card.recording .rec-timer{ display:block; }

.rec-bar{
  display:none; position:absolute; bottom:0; left:0;
  height:3px; background:var(--recording);
  border-radius:0 0 18px 18px; transition:width 1s linear;
}
.friend-card.recording .rec-bar{ display:block; }

/* ── TOAST ── */
#toast{
  position:fixed; bottom:20px; left:50%;
  transform:translateX(-50%) translateY(80px);
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:10px 20px; z-index:200;
  transition:0.3s; pointer-events:none; font-size:0.85rem; white-space:nowrap;
}
#toast.show{ transform:translateX(-50%) translateY(0); }

/* ── PLAY MODAL ── */
#playModal{
  display:none; position:fixed; inset:0;
  background:rgba(0,0,0,0.85); backdrop-filter:blur(4px);
  z-index:150; align-items:flex-end; justify-content:center;
}
#playModal.open{ display:flex; }

.play-sheet{
  background:var(--surface); border:1px solid var(--border);
  border-radius:24px 24px 0 0; width:100%; max-width:480px;
  padding:24px 20px 40px; text-align:center;
}
.play-sheet h3{ margin-bottom:4px; }
.play-sheet p{ color:var(--muted); font-size:0.82rem; margin-bottom:4px; }

.play-btn,.dismiss-btn,.save-btn{
  width:100%; border-radius:50px; padding:13px 20px; margin-top:12px;
  cursor:pointer; font-family:'Rajdhani',sans-serif; font-size:1rem; font-weight:700;
}
.play-btn{ background:linear-gradient(135deg,var(--accent),#0099bb); border:none; color:#000; }
.dismiss-btn{ background:transparent; border:1px solid var(--border); color:var(--muted); }
.save-btn{ display:none; background:transparent; border:1px solid var(--sent); color:var(--sent); }
.save-btn.visible{ display:block; }
</style>

// ── Tab switching ─────────────────────────────

window.switchTab = function(tab) {
  const su = tab === "signup";
  document.getElementById("signupFields").style.display  = su ? "flex" : "none";
  document.getElementById("signinFields").style.display  = su ? "none" : "flex";

// ── Helpers ───────────────────────────────────

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

function showError(msg) {

function showSuccess(msg) {

}

function escapeHtml(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
          .replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

function getEmoji(name) {
  const e = ["👩","👨","🧑","👵","👴","🧒","🐱","🐶","⭐","🎧"];
  return e[(name.charCodeAt(0)||65) % e.length];
}

function getDefaultFriends() {
  return [
    { id:null, name:"Mom",   emoji:"👩", status:"Tap EDIT to link" },
    { id:null, name:"Dad",   emoji:"👨", status:"Tap EDIT to link" },

}

function formatTime(secs) {
  return String(Math.floor(secs/60)).padStart(2,"0") + ":" + String(secs%60).padStart(2,"0");
}

function friendlyAuthError(code) {
  const m = {
    "auth/email-already-in-use":   "❌ That email is already registered. Try signing in.",
    "auth/invalid-email":          "❌ Invalid email address.",
    "auth/weak-password":          "❌ Password must be at least 6 characters.",

  };
  return m[code] || "❌ " + code;
}

// ── Clipboard (with Safari fallback) ─────────
function copyToClipboard(text, successMsg) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(() => toast(successMsg))
      .catch(() => clipboardFallback(text, successMsg));
  } else {
    clipboardFallback(text, successMsg);
  }
}

function clipboardFallback(text, successMsg) {
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    toast(ok ? successMsg : "Copy: " + text);
  } catch(e) {
    toast("Your code: " + text);
  }
}

// ── Vibration (silent no-op on iOS) ──────────
function vibrateStart()  { if (navigator.vibrate) navigator.vibrate(80); }
function vibrateSent()   { if (navigator.vibrate) navigator.vibrate([60, 40, 60]); }

// ── Audio format detection (iPhone/Safari compatible) ─────
function getBestMimeType() {
  const candidates = [
    "audio/mp4;codecs=mp4a.40.2",  // AAC-LC in MP4 — Safari / iPhone first choice
    "audio/mp4",                    // MP4 generic
    "audio/webm;codecs=opus",       // Chrome / Android first choice
    "audio/webm",                   // WebM generic
    "audio/ogg;codecs=opus"         // Firefox fallback
  ];
  for (const mime of candidates) {
    if (MediaRecorder.isTypeSupported(mime)) return mime;
  }
  return "";   // let browser choose
}

function extForMime(mime) {
  if (mime.startsWith("audio/mp4"))  return ".m4a";
  if (mime.startsWith("audio/ogg"))  return ".ogg";
  return ".webm";
}

// ── Friend-code generation ────────────────────
//
// Format:  NAME-NNNN   e.g. RAJ-4837
// Rules:
//   • prefix = display name, uppercase letters only, max 6 chars
//   • suffix = 4 random digits
//   • stored in global_directory keyed by the lowercase code ("raj-4837")
//   • collision check: regenerate if key already taken (rare)

function makeCodePrefix(name) {
  return name.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 6) || "USER";
}

async function generateUniqueFriendCode(name) {
  const prefix = makeCodePrefix(name);
  let code, snap;
  let attempts = 0;
  do {
    const digits = String(Math.floor(Math.random() * 9000) + 1000); // 1000-9999
    code  = prefix + "-" + digits;
    snap  = await get(ref(db, "global_directory/" + code.toLowerCase()));
    attempts++;
    if (attempts > 20) throw new Error("Could not generate unique code");
  } while (snap.exists());
  return code;
}

// ── Persistence ───────────────────────────────

async function saveUserProfile() {
  if (!currentUser) return;
  await set(ref(db, "users/" + currentUser.uid), {
    name:       myProfile.name,
    email:      myProfile.email,
    friendCode: myProfile.friendCode,
    friends:    myFriends,
    lastSeen:   Date.now()
  });
}

// ── Boot app ──────────────────────────────────

async function bootApp(user) {
  currentUser = user;
  const snap  = await get(ref(db, "users/" + currentUser.uid));

  if (snap.exists()) {
    myProfile          = snap.val();
    myFriends          = myProfile.friends || getDefaultFriends();
    lastLoginTimestamp = myProfile.lastSeen || 0;
  } else {
    // Edge case: auth exists but no DB record (e.g. DB was wiped)
    myProfile = { name: user.email.split("@")[0], email: user.email,
                  friendCode: await generateUniqueFriendCode(user.email.split("@")[0]) };
    myFriends = getDefaultFriends();
    lastLoginTimestamp = Date.now();
    await saveUserProfile();
    await set(ref(db, "global_directory/" + myProfile.friendCode.toLowerCase()),
              { uid: currentUser.uid, name: myProfile.name });
  }

  // Refresh lastSeen
  await update(ref(db, "users/" + currentUser.uid), { lastSeen: Date.now() });

  // Show app
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appScreen").style.display   = "flex";
  document.getElementById("headerCode").textContent    = myProfile.friendCode;

  document.getElementById("userBadge").onclick = () => {
    copyToClipboard(myProfile.friendCode, "📋 " + myProfile.friendCode + " copied!");
  };

  await initMicrophone();
  buildDashboard();
  if (!listenerAttached) { listenerAttached = true; listenForMessages(); }
}

// ── Sign Up ───────────────────────────────────

document.getElementById("signupBtn").onclick = async () => {
  const name  = document.getElementById("signupName").value.trim();
  const email = document.getElementById("signupEmail").value.trim();
  const pass  = document.getElementById("signupPass").value;

  const letters = name.replace(/[^a-zA-Z]/g,"");
  if (letters.length < 2)  { showError("❌ Display name needs at least 2 letters."); return; }
  if (!email)               { showError("❌ Enter your email.");                      return; }
  if (pass.length < 6)      { showError("❌ Password needs 6+ characters.");          return; }

  try {
    // Generate unique friend code before creating account
    const friendCode = await generateUniqueFriendCode(name);

    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    currentUser = cred.user;

    myProfile = { name, email, friendCode };
    myFriends = getDefaultFriends();
    lastLoginTimestamp = Date.now();

    // Save profile
    await set(ref(db, "users/" + currentUser.uid), {
      name, email, friendCode, friends: myFriends, lastSeen: Date.now()
    });

    // Index in global_directory by the friend code (lowercase key)
    await set(ref(db, "global_directory/" + friendCode.toLowerCase()),
              { uid: currentUser.uid, name });

    // Show code reveal screen instead of going straight to app
    document.getElementById("signupFields").style.display = "none";
    document.getElementById("loginError").style.display   = "none";
    document.getElementById("codeDisplay").textContent    = friendCode;
    document.getElementById("codeReveal").style.display   = "flex";

  } catch (err) {
    showError(friendlyAuthError(err.code || err.message));
  }
};

// Copy code button on reveal screen
document.getElementById("codeCopyBtn").onclick = () => {
  const code = document.getElementById("codeDisplay").textContent;
  copyToClipboard(code, "📋 " + code + " copied!");
};

// "Let's go" button on reveal screen → boot the app
document.getElementById("codeGoBtn").onclick = async () => {
  try { await bootApp(currentUser); } catch(e) { showError("Error loading app."); }
};

// ── Sign In ───────────────────────────────────

document.getElementById("signinBtn").onclick = async () => {
  const email = document.getElementById("signinEmail").value.trim();
  const pass  = document.getElementById("signinPass").value;
  if (!email || !pass) { showError("❌ Enter email and password."); return; }
  try {
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    await bootApp(cred.user);
  } catch (err) {
    showError(friendlyAuthError(err.code));
  }
};

// ── Forgot password ───────────────────────────

document.getElementById("forgotBtn").onclick = async () => {
  const email = document.getElementById("signinEmail").value.trim();
  if (!email) { showError("❌ Enter your email above first."); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    showSuccess("✅ Reset email sent! Check your inbox.");
  } catch (err) { showError(friendlyAuthError(err.code)); }
};

// ── Auto-restore session ──────────────────────

onAuthStateChanged(auth, async (user) => {
  if (user && document.getElementById("appScreen").style.display !== "flex") {
    try { await bootApp(user); } catch(e) { console.error("Session restore failed:", e); }
  }
});

// ── Microphone ────────────────────────────────

async function initMicrophone() {
  try {
    if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio:true });
    return true;
  } catch(err) {
    console.error(err); toast("❌ Microphone access denied"); return false;
  }
}

// ── Recording timer ───────────────────────────

function startRecTimer(card) {
  recSecondsElapsed = 0; activeRecCard = card;
  const timerEl = card.querySelector(".rec-timer");
  const barEl   = card.querySelector(".rec-bar");

  barEl.style.transition = "none";
  barEl.style.width = "0%";
  requestAnimationFrame(() => {
    barEl.style.transition = "width " + MAX_RECORD_SECS + "s linear";
    barEl.style.width = "100%";
  });
  timerEl.textContent = "● " + formatTime(0);

  recTimerInterval = setInterval(() => {
    recSecondsElapsed++;
    timerEl.textContent = "● " + formatTime(recSecondsElapsed);
    if (recSecondsElapsed === MAX_RECORD_SECS - 10) toast("⚠️ 10 seconds left");
  }, 1000);

  recAutoStopTimer = setTimeout(() => {
    if (mediaRecorder && mediaRecorder.state === "recording") {
      toast("⏹ Max length reached — sending…");
      mediaRecorder.stop();
      card.classList.remove("recording");
      isRecording = false;
    }
    stopRecTimer();
  }, MAX_RECORD_SECS * 1000);
}

function stopRecTimer() {
  clearInterval(recTimerInterval); clearTimeout(recAutoStopTimer);
  recTimerInterval = recAutoStopTimer = null; recSecondsElapsed = 0;
  if (activeRecCard) {
    const b = activeRecCard.querySelector(".rec-bar");
    if (b) { b.style.transition = "none"; b.style.width = "0%"; }
    activeRecCard = null;
  }
}

// ── Audio upload ──────────────────────────────

async function uploadAudio(blob, recipientUid, ext) {
  const path    = "audio/" + currentUser.uid + "/" + recipientUid + "/" + Date.now() + ext;
  const fileRef = storageRef(storage, path);
  await uploadBytes(fileRef, blob);
  return await getDownloadURL(fileRef);
}

// ── Send message ──────────────────────────────

async function sendMessageToFriend(friend) {
  if (!friend.id)          { toast("❌ Friend not linked. Tap EDIT."); return; }
  if (!audioChunks.length) { toast("No audio recorded");               return; }
  try {
    const inboxSnap = await get(ref(db, "messages/" + friend.id));
    if (inboxSnap.exists() && Object.keys(inboxSnap.val()).length >= MAX_INBOX) {
      toast("❌ Their inbox is full. Try later."); return;
    }
    const mime     = mediaRecorder.mimeType;
    const ext      = extForMime(mime);
    const blob     = new Blob(audioChunks, { type: mime });
    const audioUrl = await uploadAudio(blob, friend.id, ext);
    const msgRef   = push(ref(db, "messages/" + friend.id));
    await set(msgRef, {
      from: currentUser.uid, fromName: myProfile.name,
      audioUrl, timestamp: Date.now(), isRead: false
    });
    vibrateSent();
    toast("✓ Voice sent to " + escapeHtml(friend.name));
  } catch(err) { console.error(err); toast("❌ Failed to send"); }
}

// ── Message queue ─────────────────────────────

function listenForMessages() {
  const msgsRef  = ref(db, "messages/" + currentUser.uid);
  const msgQuery = query(msgsRef, orderByChild("timestamp"), startAfter(lastLoginTimestamp));

  onChildAdded(msgQuery, (snap) => {
    const data = snap.val();
    if (!data) return;
    messageQueue.push({
      audioUrl: data.audioUrl, senderName: data.fromName,
      messageId: snap.key, senderId: data.from, timestamp: data.timestamp
    });
    const card = document.querySelector(".friend-card[data-friend-id='" + data.from + "']");
    if (card) card.classList.add("has-message");
    if (!queuePlaying) showNextInQueue();
  });
}

function showNextInQueue() {
  if (!messageQueue.length) { queuePlaying = false; return; }
  queuePlaying   = true;
  pendingMessage = messageQueue.shift();
  document.getElementById("playFromName").textContent =
    "📩 Message from " + escapeHtml(pendingMessage.senderName);
  document.getElementById("playTime").textContent =
    new Date(pendingMessage.timestamp).toLocaleTimeString();
  document.getElementById("saveBtn").classList.remove("visible");
  document.getElementById("playModal").classList.add("open");
}

// ── Playback & modal ──────────────────────────

async function playMessage() {
  if (!pendingMessage) return;
  try {
    const audio = new Audio(pendingMessage.audioUrl);
    await audio.play();
    document.getElementById("saveBtn").classList.add("visible");
    await remove(ref(db, "messages/" + currentUser.uid + "/" + pendingMessage.messageId));
  } catch(err) { console.error(err); toast("Playback failed"); }
}

function saveMessageAudio() {
  if (!pendingMessage) return;
  const a = document.createElement("a");
  a.href = pendingMessage.audioUrl;
  a.download = "voice_" + Date.now() + (pendingMessage.audioUrl.includes(".m4a") ? ".m4a" : ".webm");
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

function closeModal() {
  document.getElementById("playModal").classList.remove("open");
  if (pendingMessage && pendingMessage.senderId) {
    const c = document.querySelector(".friend-card[data-friend-id='" + pendingMessage.senderId + "']");
    if (c) c.classList.remove("has-message");
  }
  pendingMessage = null;
  setTimeout(showNextInQueue, 600);
}

// ── Dashboard ─────────────────────────────────

function buildDashboard() {
  const grid = document.getElementById("friendsGrid");
  grid.innerHTML = "";

  myFriends.forEach((friend, idx) => {
    const card = document.createElement("div");
    card.className = "friend-card";
    if (friend.id) card.setAttribute("data-friend-id", friend.id);

    card.innerHTML =
      '<div class="pulse-ring"></div>' +
      '<div class="msg-indicator"></div>' +
      '<div class="edit-btn">EDIT</div>' +
      '<div class="card-avatar">' + (friend.emoji || getEmoji(friend.name)) + '</div>' +
      '<div class="card-name">'   + escapeHtml(friend.name)    + '</div>' +
      '<div class="card-status">' + escapeHtml(friend.status)  + '</div>' +
      '<div class="rec-timer"></div>' +
      '<div class="rec-bar"></div>';

    let holdTimer = null, localRecording = false;

    function stopLocal() {
      if (localRecording && mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop(); stopRecTimer();
        localRecording = false; isRecording = false;
        card.classList.remove("recording");
      }
    }

    card.addEventListener("pointerdown", (e) => {
      if (e.target.classList.contains("edit-btn")) return;
      e.preventDefault();
      if (!mediaStream) { toast("⏳ Microphone not ready."); return; }
      holdTimer = setTimeout(async () => {
        if (!friend.id) { toast("Tap EDIT to link this contact first"); return; }
        try {
          audioChunks = [];
          const mime  = getBestMimeType();
          const opts  = mime ? { mimeType: mime } : {};
          mediaRecorder = new MediaRecorder(mediaStream, opts);
          mediaRecorder.ondataavailable = (ev) => audioChunks.push(ev.data);
          mediaRecorder.onstop = () => sendMessageToFriend(friend);
          mediaRecorder.start();
          vibrateStart();
          localRecording = true; isRecording = true;
          card.classList.add("recording");
          startRecTimer(card);
        } catch(err) { console.error(err); toast("Recording error"); }
      }, 300);
    });

    card.addEventListener("pointerup",     () => { clearTimeout(holdTimer); stopLocal(); });
    card.addEventListener("pointercancel", () => { clearTimeout(holdTimer); stopLocal(); });

    // ── EDIT: lookup by friend code ──
    card.querySelector(".edit-btn").addEventListener("click", async (e) => {
      e.stopPropagation();
      const raw = prompt("Enter friend's code (e.g. RAJ-4837):");
      if (!raw || !raw.trim()) return;

      const key = raw.trim().toLowerCase();  // e.g. "raj-4837"

      // Validate format: letters, dash, 4 digits
      if (!/^[a-z]+-\d{4}$/.test(key)) {
        alert("❌ Invalid code format. Should look like RAJ-4837"); return;
      }

      try {
        const snap = await get(ref(db, "global_directory/" + key));
        if (!snap.exists()) { alert("❌ No user found with that code."); return; }

        const entry = snap.val();   // { uid, name }
        if (entry.uid === currentUser.uid) { alert("❌ That's your own code!"); return; }

        myFriends[idx] = {
          id:     entry.uid,
          name:   entry.name,
          emoji:  getEmoji(entry.name),
          status: "✅ " + raw.trim().toUpperCase()   // show the code as status
        };
        await saveUserProfile();
        toast("📡 Connected to " + escapeHtml(entry.name));
        buildDashboard();
      } catch(err) { console.error(err); toast("❌ Lookup failed"); }
    });

    grid.appendChild(card);
  });
}

// ── Modal buttons ─────────────────────────────
document.getElementById("playMsgBtn").onclick    = playMessage;
document.getElementById("saveBtn").onclick       = saveMessageAudio;
document.getElementById("closeModalBtn").onclick = closeModal;

window.addEventListener("beforeunload", () => {
  if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
});
</script>
